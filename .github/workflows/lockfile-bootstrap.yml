name: One-time package lock bootstrap
on:
  push:
    paths:
      - .github/workflows/lockfile-bootstrap.yml
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve npm dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Emit install lockfile for checked-in reproducibility
        working-directory: apps/web
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const encoded = fs.readFileSync('package-lock.json').toString('base64');
          for (let i = 0; i < encoded.length; i += 2048) {
            console.log('LOCK_CHUNK:' + encoded.slice(i, i + 2048));
          }
          NODE
