name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    name: Backend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check app tests
      - run: python -m compileall -q app

  frontend:
    name: Frontend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Playwright / desktop & mobile Chromium
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  postgres-auth:
    name: Auth + Alembic / PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Start test PostgreSQL
        working-directory: .
        run: docker compose up -d --wait db
      - name: Apply auth migrations
        run: python -m alembic upgrade head
      - name: PostgreSQL auth integration
        env:
          RUN_POSTGRES_AUTH_TEST: "1"
        run: python -m pytest -q -m postgres
      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: docker compose down -v

  auth-browser-integration:
    name: Real signup/login/logout / Next + FastAPI + PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install backend
        working-directory: services/api
        run: python -m pip install -e ".[dev]"
      - name: Start PostgreSQL
        run: docker compose up -d --wait db
      - name: Apply schema
        working-directory: services/api
        run: python -m alembic upgrade head
      - name: Start live backend
        working-directory: services/api
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Install web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end authentication
        working-directory: apps/web
        env:
          RUN_AUTH_INTEGRATION: "1"
        run: npx playwright test tests/e2e/auth-integration.spec.ts --project=desktop-chromium
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

  database:
    name: PostgreSQL + pgvector smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Boot local database container
        run: docker compose up -d --wait db
      - name: Assert vector extension exists
        run: |
          docker compose exec -T db psql -U llm_dev -d llm_dev -v ON_ERROR_STOP=1 -tAc "SELECT extversion FROM pg_extension WHERE extname = 'vector';" | grep -Eq '^[0-9]'
      - name: Tear down
        if: always()
        run: docker compose down -v
